<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Solvis Mukesh Pahuja</title>
  <meta name="description" content="Digital Contact Card for Solvis Mukesh Pahuja - Software Engineer & Product Manager." />
  <meta name="theme-color" content="#11151f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Google Fonts: Plus Jakarta Sans (English) + Cairo (Arabic) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Ambient Soft Studio Background -->
  <div class="ambient-backdrop"></div>

  <div class="screen-stage">
    
    <!-- 3D-Look Silver Metallic Card (Static position with dynamic sweeping silver shine) -->
    <main class="silver-card">
      
      <!-- Continuous Metallic Shimmer / Light Sweep Layer -->
      <div class="silver-light-sweep"></div>
      <div class="silver-grain-layer"></div>

      <!-- Card Top Bar: Language Switcher Inside the Card -->
      <header class="card-inner-header">
        <div class="header-spacer"></div>
        
        <!-- Language Switcher INSIDE the card -->
        <div class="card-lang-switch">
          <button id="btnEn" class="inner-lang-btn active" type="button">English</button>
          <span class="lang-divider">|</span>
          <button id="btnAr" class="inner-lang-btn" type="button">العربية</button>
        </div>
      </header>

      <!-- Profile Header -->
      <section class="profile-section">
        <div class="avatar-frame">
          <div class="silver-bezel">
            <img id="profileAvatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80" alt="Solvis Mukesh Pahuja" />
          </div>
          <span class="active-dot"></span>
        </div>

        <div class="identity-info">
          <h1 id="profileName" class="user-title">Solvis Mukesh Pahuja</h1>
          <p id="profileRole" class="user-subtitle">Software Engineer & Product Manager</p>
        </div>
      </section>

      <!-- 4 Core Action Buttons (3D Beveled Silver Finish) -->
      <section class="buttons-grid">
        
        <!-- Button 1: Save Contact (Primary Titanium CTA) -->
        <button id="btnSaveContact" class="card-btn btn-save" type="button">
          <div class="btn-sheen"></div>
          <div class="btn-icon-plate">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
          </div>
          <div class="btn-labels">
            <span id="txtSaveContact" class="label-primary">Save Contact</span>
            <span id="txtSaveContactSub" class="label-secondary">Add directly to your phone</span>
          </div>
          <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>

        <!-- Button 2: Direct Call -->
        <a id="btnCall" href="tel:+96565534802" class="card-btn btn-action btn-call">
          <div class="btn-sheen"></div>
          <div class="btn-icon-plate icon-call">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
          </div>
          <div class="btn-labels">
            <span id="txtCall" class="label-primary">Call Directly</span>
            <span class="label-secondary num-format" dir="ltr">+965 65534802</span>
          </div>
          <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </a>

        <!-- Button 3: Direct WhatsApp -->
        <a id="btnWhatsapp" href="https://wa.me/96565534802" target="_blank" rel="noopener noreferrer" class="card-btn btn-action btn-wa">
          <div class="btn-sheen"></div>
          <div class="btn-icon-plate icon-wa">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.04 2m.01 1.67c2.2 0 4.26.86 5.82 2.42a8.225 8.225 0 0 1 2.41 5.83c0 4.54-3.7 8.24-8.24 8.24-1.42 0-2.82-.37-4.06-1.07l-.29-.17-3.12.82.83-3.04-.19-.3a8.21 8.21 0 0 1-1.26-4.48c0-4.54 3.7-8.24 8.24-8.24m4.52 11.66c-.25-.13-1.47-.72-1.7-.81-.23-.08-.39-.13-.56.13-.17.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.13-1.05-.39-2-1.23-.74-.66-1.24-1.47-1.39-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.13-.15.17-.25.25-.42.08-.17.04-.32-.02-.45-.06-.13-.56-1.35-.77-1.85-.2-.49-.41-.42-.56-.43h-.48c-.17 0-.44.06-.67.31-.23.25-.88.86-.88 2.1 0 1.24.9 2.44 1.03 2.61.13.17 1.77 2.7 4.29 3.79.6.26 1.07.41 1.44.53.6.19 1.15.16 1.58.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.06-.11-.23-.18-.48-.31z"/>
            </svg>
          </div>
          <div class="btn-labels">
            <span id="txtWhatsapp" class="label-primary">WhatsApp</span>
            <span id="txtWhatsappSub" class="label-secondary">Send a message</span>
          </div>
          <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </a>

        <!-- Button 4: Direct Email -->
        <a id="btnEmail" href="mailto:solvis.kw@gmail.com" class="card-btn btn-action btn-mail">
          <div class="btn-sheen"></div>
          <div class="btn-icon-plate icon-mail">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
          </div>
          <div class="btn-labels">
            <span id="txtEmail" class="label-primary">Send Email</span>
            <span class="label-secondary email-ltr">solvis.kw@gmail.com</span>
          </div>
          <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </a>

      </section>

      <!-- Trust-Building Quote Section (Replaces the labels) -->
      <footer class="trust-quote-box">
        <svg class="quote-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M14.017 21v-7.391c0-5.704 3.731-9.57 8.983-10.609l.995 2.151c-2.432.917-3.995 3.638-3.995 5.849h4v10h-9.983zm-14.017 0v-7.391c0-5.704 3.748-9.57 9-10.609l.996 2.151c-2.433.917-3.996 3.638-3.996 5.849h3.983v10h-9.983z"/>
        </svg>
        <p id="trustQuoteText" class="quote-text">
          "Building reliable digital products and lasting partnerships with integrity."
        </p>
      </footer>

    </main>
  </div>

  <!-- Toast Notification -->
  <div id="toastNotification" class="toast-popup" role="alert">
    <div class="toast-dot">✓</div>
    <span id="toastMessage">Contact saved!</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
